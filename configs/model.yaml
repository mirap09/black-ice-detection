# YOLOv8 Model Configuration

# Model variant
model_name: yolov8s.pt  # Options: yolov8n.pt, yolov8s.pt, yolov8m.pt, yolov8l.pt, yolov8x.pt

# Training parameters
training:
  epochs: 100
  batch_size: 16
  img_size: 640
  patience: 20  # Early stopping patience

  # Optimizer
  optimizer: AdamW
  lr0: 0.001  # Initial learning rate
  lrf: 0.01   # Final learning rate (lr0 * lrf)
  momentum: 0.937
  weight_decay: 0.0005

  # Loss weights
  box: 7.5
  cls: 0.5
  dfl: 1.5

  # Augmentation
  hsv_h: 0.015  # HSV-Hue augmentation
  hsv_s: 0.7    # HSV-Saturation augmentation
  hsv_v: 0.4    # HSV-Value augmentation
  degrees: 0.0  # Rotation (+/- deg)
  translate: 0.1  # Translation (+/- fraction)
  scale: 0.5    # Scale (+/- gain)
  shear: 0.0    # Shear (+/- deg)
  perspective: 0.0  # Perspective (+/- fraction)
  flipud: 0.0   # Vertical flip probability
  fliplr: 0.5   # Horizontal flip probability
  mosaic: 1.0   # Mosaic augmentation probability
  mixup: 0.1    # Mixup augmentation probability

  # Data
  workers: 8
  cache: false  # Cache images for faster training

# Validation parameters
validation:
  val_interval: 1  # Validate every N epochs
  save_period: -1  # Save checkpoint every N epochs (-1 to disable)
  conf_threshold: 0.25
  iou_threshold: 0.45

# Inference parameters
inference:
  conf_threshold: 0.5
  iou_threshold: 0.45
  max_det: 100
  device: cuda  # cuda, cpu, or mps (Apple Silicon)

# Export parameters
export:
  format: onnx  # onnx, torchscript, coreml, tflite
  dynamic: false  # Dynamic input shapes
  simplify: true  # Simplify ONNX model
