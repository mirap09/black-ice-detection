# Data Augmentation Configuration
# Using Albumentations library

# Augmentation pipeline for training
train_augmentation:
  # Geometric transforms
  geometric:
    horizontal_flip:
      p: 0.5

    rotate:
      limit: 15  # degrees
      p: 0.3

    shift_scale_rotate:
      shift_limit: 0.1
      scale_limit: 0.2
      rotate_limit: 10
      p: 0.5

    perspective:
      scale: 0.05
      p: 0.2

  # Photometric transforms
  photometric:
    random_brightness_contrast:
      brightness_limit: 0.3
      contrast_limit: 0.3
      p: 0.7

    hue_saturation_value:
      hue_shift_limit: 10
      sat_shift_limit: 30
      val_shift_limit: 20
      p: 0.5

    rgb_shift:
      r_shift_limit: 20
      g_shift_limit: 20
      b_shift_limit: 20
      p: 0.3

    random_gamma:
      gamma_limit: [80, 120]
      p: 0.3

  # Weather/environmental effects
  weather:
    random_rain:
      slant_lower: -10
      slant_upper: 10
      drop_length: 20
      drop_width: 1
      p: 0.15

    random_fog:
      fog_coef_lower: 0.1
      fog_coef_upper: 0.3
      p: 0.1

    random_snow:
      snow_point_lower: 0.1
      snow_point_upper: 0.3
      brightness_coeff: 1.5
      p: 0.1

  # Quality degradation (simulate camera issues)
  quality:
    motion_blur:
      blur_limit: 7
      p: 0.3

    gaussian_blur:
      blur_limit: 5
      p: 0.2

    gaussian_noise:
      var_limit: [10, 50]
      p: 0.2

    iso_noise:
      color_shift: 0.05
      intensity: 0.5
      p: 0.2

# Validation augmentation (minimal, only resizing/normalization)
val_augmentation:
  resize:
    height: 640
    width: 640

  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

# Test augmentation (same as validation)
test_augmentation:
  resize:
    height: 640
    width: 640

  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

# Augmentation settings
settings:
  bbox_params:
    format: yolo
    min_area: 100  # Minimum bbox area in pixels
    min_visibility: 0.3  # Minimum visible area after augmentation

  # Number of augmented copies per image
  augmentation_factor: 3  # Generate 3 augmented versions per original
